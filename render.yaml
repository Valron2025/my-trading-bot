services:
  - type: web
    name: trading-bot-web
    runtime: python
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: gunicorn web_server:app --bind 0.0.0.0:$PORT --workers 1 --threads 1 --timeout 600 --max-requests 500 --max-requests-jitter 50
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: TBANK_TOKEN
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ENABLE_OTC_TRADING
        value: "false"
      - key: LOG_LEVEL
        value: "WARNING"
      - key: PYTHONPATH
        value: "."
      - key: TBANK_API_URL
        value: "invest-public-api.tbank.ru:443"
      - key: SCAN_INTERVAL
        value: "300"              # Сканирование каждые 5 минут
      - key: MAX_TICKERS_TO_SCAN
        value: "5"                # Только 5 тикеров за раз
      - key: PARALLEL_WORKERS
        value: "2"                # 2 параллельных запроса
      - key: SCAN_CACHE_TTL
        value: "600"              # Кэш сканирования 10 минут
      - key: API_MIN_INTERVAL
        value: "2.0"              # 2 секунды между запросами (БЫЛО 1.0)
      - key: CANDLES_CACHE_TTL
        value: "600"              # Кэш свечей 10 минут (БЫЛО 120)
      - key: MAX_REQUESTS
        value: "500"              # Максимум запросов на воркер
      - key: POSITION_CHECK_INTERVAL
        value: "120"              # 2 минуты между проверками позиций

    healthCheckPath: /health
    autoDeploy: true
    plan: free
    numInstances: 1