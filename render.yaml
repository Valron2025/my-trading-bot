services:
  - type: web
    name: trading-bot-web
    runtime: image
    buildCommand: |
      docker build -t trading-bot-web .
      # Установка CA-сертификатов (критично для SSL/TLS)
      apt-get update && apt-get install -y ca-certificates
      update-ca-certificates
      
      # Принудительная установка certifi
      pip install --upgrade pip
      pip install -r requirements.txt
      
      # ✅ КОПИРУЕМ СЕРТИФИКАТЫ certifi В СИСТЕМНУЮ ДИРЕКТОРИЮ
      python -c "import certifi; import shutil; shutil.copy(certifi.where(), '/etc/ssl/certs/ca-certificates.crt')"
      
      echo "✅ Сертификаты установлены: $(python -c 'import certifi; print(certifi.where())')"
    startCommand: |
      docker run -p 10000:10000 trading-bot-web
      export SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
      export REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
      export GRPC_SSL_CIPHER_SUITES='HIGH+ECDSA+HIGH'
      export GRPC_DNS_RESOLVER=native
      export TBANK_API_URL=invest-public-api.tbank.ru:443
      export SSL_TBANK_VERIFY=True
      
      # Диагностика SSL перед запуском
      python -c "import ssl, socket, certifi; ctx=ssl.create_default_context(cafile=certifi.where()); s=socket.create_connection(('invest-public-api.tbank.ru',443), timeout=10); ss=ctx.wrap_socket(s, server_hostname='invest-public-api.tbank.ru'); print(f'🔐 TLS OK: {ss.version()}'); ss.close()" || echo "⚠️ TLS диагностика не удалась, но продолжаем..."
      
      gunicorn web_server:app \
        --bind 0.0.0.0:$PORT \
        --workers 1 \
        --threads 1 \
        --timeout 600 \
        --max-requests 500 \
        --max-requests-jitter 50 \
        --preload
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

      # ========== API КЛЮЧИ ==========
      - key: TBANK_TOKEN
        sync: false
      - key: TBANK_ACCOUNT_ID
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

      # ========== 🔧 ФИКС ДЛЯ RENDER (SSL/TLS) ==========
      - key: TBANK_API_URL
        value: "invest-public-api.tbank.ru:443"
      - key: TINKOFF_API_URL
        value: "invest-public-api.tbank.ru:443"
      - key: INVEST_API_URL
        value: "invest-public-api.tbank.ru:443"
      - key: GRPC_DNS_RESOLVER
        value: "native"
      - key: GRPC_VERBOSITY
        value: "ERROR"
      - key: GRPC_SSL_CIPHER_SUITES
        value: "HIGH+ECDSA+HIGH"
      - key: SSL_CERT_FILE
        value: "/etc/ssl/certs/ca-certificates.crt"
      - key: REQUESTS_CA_BUNDLE
        value: "/etc/ssl/certs/ca-certificates.crt"
      - key: SSL_TBANK_VERIFY
        value: "True"

      # ========== НАСТРОЙКИ БОТА ==========
      - key: ENABLE_OTC_TRADING
        value: "false"
      - key: LOG_LEVEL
        value: "INFO"
      - key: PYTHONPATH
        value: "."

      # ========== ОПТИМИЗАЦИЯ ДЛЯ RENDER ==========
      - key: SCAN_INTERVAL
        value: "300"
      - key: MAX_TICKERS_TO_SCAN
        value: "5"
      - key: PARALLEL_WORKERS
        value: "2"
      - key: SCAN_CACHE_TTL
        value: "600"
      - key: API_MIN_INTERVAL
        value: "2.0"
      - key: CANDLES_CACHE_TTL
        value: "600"
      - key: MAX_REQUESTS
        value: "500"
      - key: POSITION_CHECK_INTERVAL
        value: "120"

    healthCheckPath: /health
    autoDeploy: true
    plan: free
    numInstances: 1