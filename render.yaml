services:
  - type: web
    name: trading-bot-web
    runtime: python
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: gunicorn web_server:app --bind 0.0.0.0:$PORT --workers 1 --threads 1 --timeout 600 --max-requests 500 --max-requests-jitter 50 --preload
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

      # ========== API КЛЮЧИ ==========
      - key: TBANK_TOKEN
        sync: false
      - key: TBANK_ACCOUNT_ID
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

      # ========== 🔧 ФИКС ДЛЯ RENDER ==========
      - key: TBANK_API_URL
        value: "invest-public-api.tbank.ru:443"
      - key: TINKOFF_API_URL
        value: "invest-public-api.tbank.ru:443"
      - key: INVEST_API_URL
        value: "invest-public-api.tbank.ru:443"
      - key: GRPC_DNS_RESOLVER
        value: "native"
      - key: GRPC_VERBOSITY
        value: "ERROR"

      # ========== НАСТРОЙКИ БОТА ==========
      - key: ENABLE_OTC_TRADING
        value: "false"
      - key: LOG_LEVEL
        value: "INFO"
      - key: PYTHONPATH
        value: "."

      # ========== ОПТИМИЗАЦИЯ ДЛЯ RENDER ==========
      - key: SCAN_INTERVAL
        value: "300"
      - key: MAX_TICKERS_TO_SCAN
        value: "5"
      - key: PARALLEL_WORKERS
        value: "2"
      - key: SCAN_CACHE_TTL
        value: "600"
      - key: API_MIN_INTERVAL
        value: "2.0"
      - key: CANDLES_CACHE_TTL
        value: "600"
      - key: MAX_REQUESTS
        value: "500"
      - key: POSITION_CHECK_INTERVAL
        value: "120"

    healthCheckPath: /health
    autoDeploy: true
    plan: free
    numInstances: 1