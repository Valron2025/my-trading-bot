services:
  - type: web
    name: trading-bot-web
    runtime: python
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: gunicorn web_server:app --bind 0.0.0.0:$PORT --workers 1 --threads 1 --timeout 600 --max-requests 500 --max-requests-jitter 50
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: TBANK_TOKEN
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ENABLE_OTC_TRADING
        value: "false"
      - key: LOG_LEVEL
        value: "WARNING"
      - key: PYTHONPATH
        value: "."
      # ✅ НОВЫЕ ПЕРЕМЕННЫЕ ДЛЯ ОПТИМИЗАЦИИ
      - key: SCAN_INTERVAL
        value: "120"              # Сканировать каждые 2 минуты
      - key: MAX_TICKERS_TO_SCAN
        value: "8"                # Анализировать только 8 тикеров
      - key: PARALLEL_WORKERS
        value: "3"                # 3 параллельных запроса
      - key: SCAN_CACHE_TTL
        value: "180"              # Кэш сканирования на 3 минуты
      - key: API_MIN_INTERVAL
        value: "1.0"              # Минимальный интервал между API запросами
      - key: CANDLES_CACHE_TTL
        value: "120"              # Кэш свечей на 2 минуты
      - key: MAX_REQUESTS
        value: "500"              # Максимум запросов на воркер
    healthCheckPath: /health
    autoDeploy: true
    plan: free
    numInstances: 1